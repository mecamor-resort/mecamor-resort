<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecamor Resort</title>
    <style>
        body { margin: 0; font-family: sans-serif; }

        /* Баннер */
        .banner {
            width: 100%;
            height: 200px;
            background-color: #ccc; /* Здесь будет твой баннер */
            background-size: cover;
            background-position: center;
        }

        /* Контейнер для аватарки и имени */
        .header-content {
            padding: 0 20px;
            display: flex;
            align-items: flex-start;
        }

        /* Аватарка (круглая) */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            margin-top: -60px; /* Поднимаем вверх, чтобы накладывалась на баннер */
            background-color: #eee;
            background-size: cover;
            background-position: center;
        }

        .info {
            margin-left: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Место для баннера -->
    <div class="banner"></div>

    <!-- Место для аватарки и имени -->
    <div class="header-content">
        <div class="avatar"></div>
        <div class="info">
            <h1>Mecamor Resort</h1>
        </div>
    </div>

</body>
</html>
