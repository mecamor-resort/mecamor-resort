<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecamor Resort</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f4f4f4; }

        /* Баннер */
        .banner {
            width: 100%;
            height: 200px;
            background-image: url('IMG_20260822_031529.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Контейнер для аватарки и имени */
        .header-content {
            padding: 0 20px;
            display: flex;
            align-items: flex-start;
        }

        /* Аватарка */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            margin-top: -60px;
            background-image: url('IMG_20260822_031545.jpg');
            background-size: cover;
            background-position: center;
            background-color: #fff;
        }

        .info {
            margin-left: 20px;
            margin-top: 10px;
        }
        
        h1 { margin: 0; font-size: 24px; }
    </style>
</head>
<body>

    <div class="banner"></div>

    <div class="header-content">
        <div class="avatar"></div>
        <div class="info">
            <h1>Mecamor Resort</h1>
        </div>
    </div>

</body>
</html>
